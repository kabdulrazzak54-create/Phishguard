{% extends "base.html" %}
{% block title %}Scan QR{% endblock %}
{% block content %}
<h1 class="h3 mb-3"><i class="bi bi-qr-code-scan"></i> Scan a QR code image</h1>
<div class="alert alert-warning"><i class="bi bi-exclamation-triangle"></i> The QR image is decoded on the server, in memory, and is not stored. Links inside are never opened.</div>
<div class="card pg-card p-4">
  <form method="post" action="{{ url_for('analyze_qr_route') }}" enctype="multipart/form-data" class="scan-form">
    <label for="qr_image" class="form-label fw-semibold">Upload a PNG, JPG, JPEG or WEBP image (max 5 MB)</label>
    <input class="form-control" type="file" id="qr_image" name="qr_image" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" required>
    <div class="form-check mt-3">
      <input class="form-check-input" type="checkbox" id="save_history" name="save_history">
      <label class="form-check-label" for="save_history">Save anonymous scan statistics for this session/project demo.</label>
    </div>
    <button type="submit" class="btn btn-primary mt-3"><span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span> <span class="btn-label">Analyze QR Code</span></button>
  </form>
</div>
{% endblock %}
